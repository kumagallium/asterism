# Graphium(provnote) の .github/workflows/tagpr.yml を asterism 用に簡素化。
# main への push ごとに「次リリースの PR」を自動で維持/更新し、その PR を merge すると
# VERSION を bump して vX.Y.Z タグ + CHANGELOG を切る。
# Tauri ビルドのトリガーは asterism には不要なので外した（必要なら PyPI publish 等を後で追加）。
name: tagpr

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # actions: write is required for `gh workflow run` (dispatch desktop-release).
  # The default GITHUB_TOKEN lacks the actions scope, so the dispatch step 403s
  # ("Resource not accessible by integration") without this — observed on the
  # v0.13.1 tag. Same requirement as Graphium's tagpr.yml.
  actions: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tagpr
        uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tagpr creates the release with GITHUB_TOKEN, and GITHUB_TOKEN-triggered
      # events do NOT start new workflow runs (GitHub's no-recursion rule) — so
      # `on: release: created` in desktop-release.yml never fires on a real
      # release. workflow_dispatch IS exempt from that rule, so dispatch it
      # explicitly when tagpr actually cut a tag. (Same fix as Graphium's
      # tagpr.yml dispatching its Tauri build.)
      - name: Trigger desktop release build
        if: steps.tagpr.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run desktop-release.yml -f tag=${{ steps.tagpr.outputs.tag }}
