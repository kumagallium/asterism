# [prod-api] 本番 api イメージを GHCR へ発行する（Dewy プル型デプロイの供給側）
#
# Dewy PoC（docs/reports/dewy-pull-deploy-poc.md）のリリース経路:
#   このワークフローが ghcr.io/<owner>/asterism-api:vX.Y.Z を push する
#   → asterism-prod 上の `dewy container` がタグを semver 検出して自動デプロイする。
# サーバへの inbound 接続（SSH 鍵・deploy 鍵）は一切増やさない＝プル型の要。
#
# 使い方:
#   通常リリース: `git tag api-v0.0.2 && git push origin api-v0.0.2`
#     （または workflow_dispatch で tag=v0.0.2 — dispatch はこのファイルが main に
#       入ってから使える。タグ push はタグ先コミットの workflow で動くため即使える）
#   ロールバック: dispatch で tag=v0.0.3 + source_tag=v0.0.1 → ビルドせず re-tag
#     （Dewy は「最新 semver」を追うため、巻き戻しも前進タグで表現する = roll-forward）
#
# イメージは linux/amd64 のみ（asterism-prod = x86_64。amd64 wheel を焼く既存方針
# docs/architecture/production-deployment.md と同じ理由で multi-arch にしない）。

name: prod-api-release

on:
  push:
    tags: ["api-v*"] # api-v0.0.2 → イメージタグ v0.0.2（本体リリース vX.Y.Z とは別空間）
  workflow_dispatch:
    inputs:
      tag:
        description: "発行するイメージタグ（例 v0.0.2・semver 必須 — Dewy が semver で最新を判定する）"
        required: true
        type: string
      source_tag:
        description: "ロールバック用: 指定すると、そのタグの既存イメージを tag へ re-tag するだけ（ビルドしない）"
        required: false
        type: string

# 規約（github-flow §5）: 権限は既定で落とし、job 単位で必要分だけ足す。
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/asterism-api

jobs:
  publish:
    name: "[prod-api] build & push image"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless 署名（GitHub OIDC）。値の入った secret は一切持たない
    steps:
      # トリガ 2 系統からイメージタグを 1 つに解決する:
      #   タグ push  → refs/tags/api-v0.0.2 の "api-" を剥いで v0.0.2
      #   dispatch  → inputs.tag をそのまま
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME#api-}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # タグの打ち間違いは「Dewy に検出されない」という無言の失敗になるので、
      # 供給側で fail-closed にする（v プレフィクス付き semver のみ通す）。
      - name: Validate tag is semver
        run: |
          for t in "${{ steps.tag.outputs.tag }}" "${{ inputs.source_tag }}"; do
            [ -z "$t" ] && continue
            echo "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
              || { echo "::error::'$t' は vX.Y.Z 形式ではありません"; exit 1; }
          done

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 通常リリース経路（source_tag 未指定）---
      - name: Checkout
        if: ${{ inputs.source_tag == '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        if: ${{ inputs.source_tag == '' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push (linux/amd64)
        if: ${{ inputs.source_tag == '' }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/upload-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          # version ラベル: `docker inspect` でどのリリースかを判別できるようにする
          # （副次効果として同一ソースの再タグでも digest が変わり、Dewy の更新検出が確実になる）
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # GHA キャッシュで 2 回目以降の pip 層を再利用する（PoC のイテレーション短縮）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # イメージの出所証明: digest に対する keyless 署名（Sigstore/Rekor 記録）。
      # 「この digest はこのリポジトリのこの workflow が作った」を第三者が検証できる。
      # サーバ側は infra/dewy/verify-latest.sh が before-deploy-hook で検証する。
      - name: Install cosign
        if: ${{ inputs.source_tag == '' }}
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless, OIDC)
        if: ${{ inputs.source_tag == '' }}
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

      # --- ロールバック経路（source_tag 指定時）---
      # レジストリ上の manifest を付け替えるだけ。イメージ本体は不変＝
      # 「ロールバック = 検証済み旧バイトへの前進タグ」を数秒で発行できる。
      # 署名は digest に紐づくため、署名済みイメージの re-tag は再署名不要で検証も通る。
      - name: Re-tag existing image (rollback)
        if: ${{ inputs.source_tag != '' }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.tag.outputs.tag }}" \
            "$IMAGE:${{ inputs.source_tag }}"

      - name: Show published tag
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}" | head -20
