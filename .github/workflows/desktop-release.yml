# Desktop release + auto-update artifacts (ADR local-first-distribution.md Phase 2).
#
# Fires when tagpr publishes a GitHub release (the "Release for vX.Y.Z" PR
# merge). Always builds and attaches the macOS .dmg for direct download. When
# the minisign secret TAURI_SIGNING_PRIVATE_KEY is present, it ALSO produces the
# signed updater bundle (Asterism_aarch64.app.tar.gz + .sig) and a latest.json,
# and attaches all three. The feed the app POLLS, however, is the Pages copy
# published by the last step (docs/updater/latest.json) — `releases/latest` flips
# to a new tag the moment tagpr publishes it, ~15 minutes before this workflow
# can attach the file (ADR local-first-distribution.md §6.1).
#
# Signing config mirrors Graphium's tauri-build.yml (same secret names). The
# updater signature is hand-produced with `tauri signer sign` (not
# createUpdaterArtifacts) so the unsigned PR-check build (desktop-build.yml)
# stays green.
name: Desktop Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build (e.g. v0.13.0)"
        required: true
      ref:
        description: "Git ref to build FROM (default: the tag). Set a branch to test workflow changes a past tag doesn't contain."
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Release build (macOS Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || steps.tag.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build SPA (live Ask mode)
        run: |
          npm install --no-audit --no-fund
          VITE_DEMO_MODE=live VITE_DEMO_AGENT_URL=/ npm run build
        working-directory: ui

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Assemble backend bundle
        run: bash desktop/scripts/bundle-backend.sh

      # Build the app UNSIGNED — tauri only signs the outer bundle, but the
      # notarization service requires every nested Mach-O (the bundled python /
      # oxigraph / .so) to be signed too, so signing happens in the deep-sign
      # step below, not here.
      - name: Build app
        run: npm run tauri build -- --bundles app
        working-directory: desktop

      # Deep-sign every nested Mach-O + notarize + staple. Skipped (unsigned)
      # when APPLE_CERTIFICATE is absent so the release still ships a .dmg
      # before the Apple secrets are configured. The in-script guard is used
      # because `secrets` is not available in a step-level `if:`.
      # Deep-sign every nested Mach-O, notarize + staple the app, AND build a
      # signed+notarized+stapled .dmg (so the disk image itself passes
      # Gatekeeper). When APPLE_CERTIFICATE is absent, this is skipped and the
      # fallback step below ships an unsigned .dmg.
      - name: Sign + notarize + staple app and dmg (if Apple secrets present)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE absent — shipping an unsigned build."
            exit 0
          fi
          bash desktop/scripts/sign-notarize-macos.sh \
            "desktop/src-tauri/target/release/bundle/macos/Asterism.app" \
            "${{ steps.tag.outputs.version }}"

      # Fallback .dmg for the unsigned case (no Apple secrets). The signed path
      # already produced a notarized Asterism_<version>_aarch64.dmg.
      - name: Package unsigned .dmg (fallback)
        shell: bash
        env:
          _CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          [ -n "${_CERT:-}" ] && { echo "signed dmg already built — skipping fallback"; exit 0; }
          VERSION="${{ steps.tag.outputs.version }}"
          APP="desktop/src-tauri/target/release/bundle/macos/Asterism.app"
          STAGE="${RUNNER_TEMP:-/tmp}/dmg"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          # Same "Resource busy" flake the signed path hit on v0.17.1 — reuse
          # its detach+retry helper rather than keeping a second bare hdiutil.
          # shellcheck source=desktop/scripts/sign-notarize-macos.sh
          source <(sed -n '/^make_dmg()/,/^}/p' desktop/scripts/sign-notarize-macos.sh)
          make_dmg "Asterism_${VERSION}_aarch64.dmg" "$STAGE"

      - name: Attach .dmg to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          DMG=$(ls Asterism_*_aarch64.dmg | head -1)
          gh release upload "$TAG" "$DMG" --clobber

      # Updater artifacts: hand-tar the .app, sign it, build latest.json.
      # Skipped (with a clear log) when the minisign secret is absent so the
      # .dmg release still succeeds before the key is configured. The in-script
      # guard is used instead of a step `if:` because `secrets` is not available
      # in step-level `if` conditions.
      - name: Build + attach updater artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY absent — skipping updater artifacts (dmg only)."
            exit 0
          fi
          npm install -g @tauri-apps/cli@2
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          REPO="${{ github.repository }}"
          APP_DIR="desktop/src-tauri/target/release/bundle/macos"
          TARBALL="Asterism_aarch64.app.tar.gz"

          # Gzipped tar of the .app is the macOS updater payload format.
          tar -C "$APP_DIR" -czf "$TARBALL" "Asterism.app"

          # Sign with the minisign key (empty password, matching key generation).
          tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "" "$PWD/$TARBALL"
          SIG=$(cat "$TARBALL.sig")

          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES=$(gh release view "$TAG" --json body -q '.body' 2>/dev/null || true)
          [ -z "$NOTES" ] && NOTES="See the release notes for $TAG."
          URL="https://github.com/$REPO/releases/download/$TAG/$TARBALL"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg sig "$SIG" \
            --arg url "$URL" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' \
            > latest.json

          echo "----- latest.json -----"; cat latest.json; echo
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sig" latest.json --clobber

      # The feed the app actually polls lives on GitHub Pages, NOT on the
      # release. Why: `releases/latest/download/latest.json` starts pointing at
      # a new tag the instant tagpr publishes it — but this workflow needs ~15
      # minutes to attach the file, so every update check in that window got a
      # 404 (the api turns it into a 502; observed live on v0.14.0). Pages is
      # updated only AFTER a build succeeds, so the switch is atomic and a
      # failed build simply leaves the previous version being offered.
      # Borrowed from Graphium's tauri-build.yml, which hit the same class of
      # failure (v0.16.4 / v0.16.5) and solved it this way.
      - name: Publish latest.json to Pages (docs/updater/latest.json on main)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GENERATED="$PWD/latest.json"
          if [ ! -f "$GENERATED" ]; then
            echo "no latest.json (updater artifacts were skipped) — nothing to publish."
            exit 0
          fi
          TAG="${{ steps.tag.outputs.tag }}"
          NEW_VERSION="${{ steps.tag.outputs.version }}"

          WORKDIR="$(mktemp -d)"
          git clone --depth=1 --branch main \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            "$WORKDIR/repo"
          cd "$WORKDIR/repo"

          # Never move the feed BACKWARDS: a re-run of an old tag's workflow must
          # not offer an older version to everyone. Equal versions are allowed
          # through (a rebuild that fills in a missing artifact); an identical
          # file is a no-op at the commit step below.
          CURRENT_FILE="docs/updater/latest.json"
          CURRENT_VERSION="0.0.0"
          [ -f "$CURRENT_FILE" ] && CURRENT_VERSION=$(jq -r '.version // "0.0.0"' "$CURRENT_FILE")
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$NEW_VERSION" | sort -V | tail -n1)
          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ] && [ "$HIGHEST" != "$NEW_VERSION" ]; then
            echo "skip: published feed is $CURRENT_VERSION, this build is $NEW_VERSION (older)."
            exit 0
          fi

          mkdir -p docs/updater
          cp "$GENERATED" "$CURRENT_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CURRENT_FILE"
          if git diff --cached --quiet; then
            echo "feed already up to date — nothing to commit."
            exit 0
          fi
          git commit -m "[chore] updater: publish latest.json for ${TAG} to Pages"
          # main moves under us (tagpr, merges) — rebase and retry rather than fail
          # the release over a push race.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "published ${NEW_VERSION} to the Pages feed."
              exit 0
            fi
            echo "push race (attempt $i) — retrying"
            sleep 5
          done
          echo "::error::could not push the Pages feed after 3 attempts"
          exit 1

      - name: Upload build artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: Asterism-release-${{ steps.tag.outputs.tag }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 14
