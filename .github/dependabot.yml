# SHA 固定した GitHub Actions の更新を PR で提案させる（github-flow §5/§6）。
# タグ参照と違い SHA 固定は上書き攻撃に強い代わりに手動更新が要る — その手間を
# Dependabot に肩代わりさせる。提案 PR はレビューして通常どおりマージする。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 注意: この labels: では Dependabot の semver ラベル（major / minor）は止まらない。
    # labels: が差し替えるのは既定ラベル（dependencies と ecosystem 名）だけで、
    # 「同名ラベルがリポジトリに在れば semver bump 種別のラベルも付ける」挙動は別経路。
    # 実際 #502 / #503 / #505（この設定を入れた 2026-08-31 より後の作成）にも major が付いた。
    # 恒久対策は .tagpr 側の名前空間分離（majorLabels = bump:major）— 2026-09-02。
    # ここの labels: は dependencies / github_actions を安定して付けるために残す。
    labels: [dependencies, github_actions]
