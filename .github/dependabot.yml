# SHA 固定した GitHub Actions の更新を PR で提案させる（github-flow §5/§6）。
# タグ参照と違い SHA 固定は上書き攻撃に強い代わりに手動更新が要る — その手間を
# Dependabot に肩代わりさせる。提案 PR はレビューして通常どおりマージする。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # ラベルを明示して Dependabot の自動付与を止める。既定のままだと semver-major な
    # 更新 PR に「major」が付き、.tagpr の majorLabels=major と衝突して、マージしただけで
    # 次リリースが v1.0.0 に昇格してしまう（2026-08-31 に #481-485 で実際に付いた）。
    labels: [dependencies, github_actions]
