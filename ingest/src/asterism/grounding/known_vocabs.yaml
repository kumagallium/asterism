# Curated starter pack of KNOWN EXTERNAL VOCABULARIES — the single source of truth
# (SoT) for both RECOGNITION (the map / reuse display) and GROUNDING (proposing a real
# external term for a class/predicate, then a human confirms — external-standard-
# alignment.md §8).
#
# INVARIANT — every term IRI here is REAL, never fabricated. Each was extracted /
# verified against the AUTHORITATIVE ontology RDF cited in the vocabulary's `source`
# (retrieved on `retrieved`). The grounding search only ever returns IRIs from this
# closed set, so the LLM/UI never invents an IRI (the human still vets the choice).
#
# CURATION, not mirroring. The list of VOCABULARIES grows by hand — the famous /
# foundational ones per ACTIVE domain (like QUDT units or the Tier-0 function library),
# NOT by importing all of LOV (~700) / BioPortal. Once a vocabulary IS in, carrying its
# whole term set is fine: choosing the standard is the curation, thinning the inside of
# a chosen standard is not (2026-09-03: the 8 scoped vocabularies below were filled from
# their own `source` RDF — 111 -> 596 terms).
#
# Terms are NEVER typed from memory. Use the importer, which reads the vocabulary's own
# `source` RDF and only ever writes IRIs that file actually contains:
#
#     python scripts/import_vocab_terms.py --verify              # 収録語が実在するか
#     python scripts/import_vocab_terms.py --prefix dcat         # 未収録の候補を見る
#     python scripts/import_vocab_terms.py --prefix dcat --add all --write
#
# `--verify` is also the drift check: it reports any recorded term the source no longer
# has (last run 2026-09-03: 0 across all 11 vocabularies).
#
# `iri` of a term = `namespace` + `name`. Keep names verbatim from the source.

