[project]
name = "asterism-mcp-tools"
version = "0.1.0"
description = "Self-built FastMCP server with starrydata-specific tools (Phase 2 #3)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # asterism-ingest gives us OxigraphClient; installed from sibling path.
    "asterism-ingest",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
asterism = "asterism_mcp.server:_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asterism_mcp"]

[tool.uv.sources]
asterism-ingest = { path = "../ingest", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Prose in this repo is Japanese, where full-width punctuation（）「」／ is correct
# typography — not an ASCII look-alike. RUF002 (docstrings) / RUF003 (comments) flag
# every one, so each Japanese file had to carry its own `# ruff: noqa` pragma; missing
# one on a new docstring turned main red (#518, v0.32.1). Ignore them once here.
# RUF001 stays ON: an ambiguous character in a *string literal* can silently corrupt an
# IRI, a prefix or a SPARQL match, so those keep a per-site noqa with a stated reason.
ignore = ["RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
