<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-label="元ファイルから設計書 proposal.md が作られ、その各節から5つのファイルが切り出され、mapping.yaml から変換ルールがコンパイルされる図">
<style>
  :root{
    --ink:#16241a; --body:#33453a; --muted:#54695b; --faint:#84987f;
    --surface:#ffffff; --surface-alt:#f5f9f3; --sink:#e5ede3;
    --line:#d5e0d2; --line-strong:#bccdb9;
    --entity:#2f6b41; --entity-soft:#dcebe0;
    --link:#2d5c86; --link-soft:#dae7f3;
    --accent:#a3661f; --accent-soft:#f4e6d4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e9f1e8; --body:#c3d3c5; --muted:#98ab9a; --faint:#748a76;
      --surface:#18211a; --surface-alt:#1d2820; --sink:#131c15;
      --line:#2b382c; --line-strong:#3f4f40;
      --entity:#7cc491; --entity-soft:#1d3626;
      --link:#88b6e0; --link-soft:#16293b;
      --accent:#e0a862; --accent-soft:#33261a;
    }
  }
  text{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; font-size:13px; fill:var(--ink)}
  .m{font-family:"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace}
  .sm{font-size:11.5px}
  .xs{font-size:10.5px; letter-spacing:.06em}
  .t-mut{fill:var(--muted)}
  .t-fnt{fill:var(--faint)}
  .t-ent{fill:var(--entity)}
  .t-lnk{fill:var(--link)}
  .t-acc{fill:var(--accent)}
  .b{font-weight:700}
  .box{fill:var(--surface); stroke:var(--line-strong); stroke-width:1.25}
  .box-alt{fill:var(--surface-alt); stroke:var(--line-strong); stroke-width:1.25}
  .box-sink{fill:var(--sink); stroke:var(--line-strong); stroke-width:1.25}
  .box-ent{fill:var(--entity-soft); stroke:var(--entity); stroke-width:1.5}
  .box-lnk{fill:var(--link-soft); stroke:var(--link); stroke-width:1.5}
  .box-acc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5}
  .ln{stroke:var(--line-strong); stroke-width:1.5; fill:none}
  .ln-lnk{stroke:var(--link); stroke-width:1.5; fill:none}
  .ln-ent{stroke:var(--entity); stroke-width:1.5; fill:none}
  .ln-dash{stroke:var(--line-strong); stroke-width:1.5; fill:none; stroke-dasharray:5 4}
  .ln-thin{stroke:var(--line); stroke-width:1; fill:none}
  .head{fill:var(--line-strong)}
  .head-lnk{fill:var(--link)}
  .head-ent{fill:var(--entity)}
</style>

  <rect class="box" x="370" y="16" width="200" height="46" rx="8"/>
  <text x="470" y="37" class="sm b" text-anchor="middle">元のファイル</text>
  <text x="470" y="53" class="xs t-mut" text-anchor="middle">CSV・Excel・装置ファイル・PDF</text>
  <line class="ln" x1="470" y1="62" x2="470" y2="88" marker-end="url(#a5)"/>

  <rect class="box-acc" x="330" y="92" width="280" height="46" rx="8"/>
  <text x="470" y="113" class="sm b t-acc" text-anchor="middle">AI が読み、人が確かめる</text>
  <text x="470" y="129" class="xs t-mut" text-anchor="middle">かんたんモードの各ステップ</text>
  <line class="ln" x1="470" y1="138" x2="470" y2="164" marker-end="url(#a5)"/>

  <rect class="box" x="350" y="168" width="240" height="50" rx="8"/>
  <text x="470" y="190" class="sm b m" text-anchor="middle">proposal.md</text>
  <text x="470" y="207" class="xs t-mut" text-anchor="middle">設計書（全文・§1〜§9）</text>

  <path class="ln" d="M470 218 V246"/>
  <path class="ln" d="M188 246 H752"/>
  <path class="ln" d="M188 246 V296" marker-end="url(#a5)"/>
  <path class="ln" d="M376 246 V296" marker-end="url(#a5)"/>
  <path class="ln" d="M564 246 V296" marker-end="url(#a5)"/>
  <path class="ln-ent" d="M752 246 V296" marker-end="url(#a6)"/>

  <text x="196" y="266" class="xs t-fnt">§1</text>
  <text x="384" y="266" class="xs t-fnt">§6</text>
  <text x="572" y="266" class="xs t-fnt">§7</text>
  <text x="760" y="266" class="xs t-ent b">§9</text>

  <rect class="box" x="104" y="300" width="168" height="54" rx="8"/>
  <text x="188" y="322" class="xs b m" text-anchor="middle">diagram.md</text>
  <text x="188" y="340" class="xs t-mut" text-anchor="middle">構造図</text>

  <rect class="box" x="292" y="300" width="168" height="54" rx="8"/>
  <text x="376" y="322" class="xs b m" text-anchor="middle">model.yaml</text>
  <text x="376" y="340" class="xs t-mut" text-anchor="middle">種類と項目の一覧</text>

  <rect class="box" x="480" y="300" width="168" height="54" rx="8"/>
  <text x="564" y="322" class="xs b m" text-anchor="middle">mie.yaml</text>
  <text x="564" y="340" class="xs t-mut" text-anchor="middle">検索タグ</text>


  <rect class="box-ent" x="668" y="300" width="168" height="54" rx="8"/>
  <text x="752" y="322" class="xs b m t-ent" text-anchor="middle">mapping.yaml</text>
  <text x="752" y="340" class="xs t-mut" text-anchor="middle">仕様（人が読む正本）</text>

  <line class="ln-ent" x1="752" y1="354" x2="752" y2="396" marker-end="url(#a6)"/>
  <text x="738" y="380" class="xs t-ent" text-anchor="end">機械が変換</text>
  <text x="738" y="394" class="xs t-fnt" text-anchor="end">AI は使わない</text>

  <rect class="box-ent" x="668" y="400" width="168" height="54" rx="8"/>
  <text x="752" y="422" class="xs b m t-ent" text-anchor="middle">mapping.rml.ttl</text>
  <text x="752" y="440" class="xs t-mut" text-anchor="middle">変換ルール（実行される）</text>

  <text x="30" y="410" class="sm t-mut">ここまでが設計です。</text>
  <text x="30" y="430" class="sm t-mut">まだデータは 1 件も</text>
  <text x="30" y="450" class="sm t-mut">作られていません。</text>

  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-ent" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
</svg>
