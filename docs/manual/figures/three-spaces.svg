<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-label="IRI 空間を土台に、事実の空間と語彙の空間が別々に乗り、両者は同じ IRI を使うことだけで繋がっている図">
<style>
  :root{
    --ink:#16241a; --body:#33453a; --muted:#54695b; --faint:#84987f;
    --surface:#ffffff; --surface-alt:#f5f9f3; --sink:#e5ede3;
    --line:#d5e0d2; --line-strong:#bccdb9;
    --entity:#2f6b41; --entity-soft:#dcebe0;
    --link:#2d5c86; --link-soft:#dae7f3;
    --accent:#a3661f; --accent-soft:#f4e6d4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e9f1e8; --body:#c3d3c5; --muted:#98ab9a; --faint:#748a76;
      --surface:#18211a; --surface-alt:#1d2820; --sink:#131c15;
      --line:#2b382c; --line-strong:#3f4f40;
      --entity:#7cc491; --entity-soft:#1d3626;
      --link:#88b6e0; --link-soft:#16293b;
      --accent:#e0a862; --accent-soft:#33261a;
    }
  }
  text{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; font-size:13px; fill:var(--ink)}
  .m{font-family:"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace}
  .sm{font-size:11.5px}
  .xs{font-size:10.5px; letter-spacing:.06em}
  .t-mut{fill:var(--muted)}
  .t-fnt{fill:var(--faint)}
  .t-ent{fill:var(--entity)}
  .t-lnk{fill:var(--link)}
  .t-acc{fill:var(--accent)}
  .b{font-weight:700}
  .box{fill:var(--surface); stroke:var(--line-strong); stroke-width:1.25}
  .box-alt{fill:var(--surface-alt); stroke:var(--line-strong); stroke-width:1.25}
  .box-sink{fill:var(--sink); stroke:var(--line-strong); stroke-width:1.25}
  .box-ent{fill:var(--entity-soft); stroke:var(--entity); stroke-width:1.5}
  .box-lnk{fill:var(--link-soft); stroke:var(--link); stroke-width:1.5}
  .box-acc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5}
  .ln{stroke:var(--line-strong); stroke-width:1.5; fill:none}
  .ln-lnk{stroke:var(--link); stroke-width:1.5; fill:none}
  .ln-ent{stroke:var(--entity); stroke-width:1.5; fill:none}
  .ln-dash{stroke:var(--line-strong); stroke-width:1.5; fill:none; stroke-dasharray:5 4}
  .ln-thin{stroke:var(--line); stroke-width:1; fill:none}
  .head{fill:var(--line-strong)}
  .head-lnk{fill:var(--link)}
  .ln-acc{stroke:var(--accent); stroke-width:1.5; fill:none}
  .head-acc{fill:var(--accent)}
  .head-ent{fill:var(--entity)}
</style>
  <rect class="box-ent" x="16" y="30" width="404" height="180" rx="10"/>
  <text x="36" y="54" class="xs t-ent b">事実の空間（ABox）</text>
  <text x="36" y="74" class="xs t-mut">実際に起きたこと。3 つ組の集まり</text>
  <rect class="box" x="36" y="88" width="364" height="30" rx="5"/>
  <text x="48" y="108" class="m sm">使用量/カレー/にんじん  分量  2</text>
  <rect class="box" x="36" y="124" width="364" height="30" rx="5"/>
  <text x="48" y="144" class="m sm">使用量/カレー/にんじん  食材  食材/にんじん</text>
  <rect class="box" x="36" y="160" width="364" height="30" rx="5"/>
  <text x="48" y="180" class="m sm">食材/にんじん  価格  120</text>

  <rect class="box-lnk" x="520" y="30" width="404" height="180" rx="10"/>
  <text x="540" y="54" class="xs t-lnk b">語彙の空間（TBox ＝ オントロジー）</text>
  <text x="540" y="74" class="xs t-mut">どんな種類と項目を使ってよいかの決まり</text>
  <rect class="box" x="540" y="88" width="364" height="30" rx="5"/>
  <text x="552" y="108" class="m sm">使用量  a  owl:Class</text>
  <rect class="box" x="540" y="124" width="364" height="30" rx="5"/>
  <text x="552" y="144" class="m sm">分量  rdfs:domain  使用量</text>
  <rect class="box" x="540" y="160" width="364" height="30" rx="5"/>
  <text x="552" y="180" class="m sm">使用量  rdfs:subClassOf  観測</text>

  <path class="ln-dash" d="M420 120 H520"/>
  <text x="470" y="112" class="xs t-acc b" text-anchor="middle">つながり</text>
  <text x="470" y="136" class="xs t-acc" text-anchor="middle">は これだけ</text>

  <path class="ln-ent" d="M218 210 V292" marker-end="url(#s1)"/>
  <path class="ln-lnk" d="M722 210 V292" marker-end="url(#s2)"/>
  <text x="232" y="256" class="xs t-ent">名前を借りる</text>
  <text x="736" y="256" class="xs t-lnk">名前を借りる</text>

  <rect class="box-sink" x="16" y="300" width="908" height="76" rx="10"/>
  <text x="36" y="324" class="xs t-fnt b">名前の空間（IRI）</text>
  <rect class="box-alt" x="36" y="334" width="200" height="28" rx="5"/>
  <text x="46" y="353" class="m xs">…/resource/使用量/…</text>
  <rect class="box-alt" x="248" y="334" width="176" height="28" rx="5"/>
  <text x="258" y="353" class="m xs">…/resource/食材/…</text>
  <rect class="box-alt" x="436" y="334" width="150" height="28" rx="5"/>
  <text x="446" y="353" class="m xs">…/ontology#分量</text>
  <rect class="box-alt" x="598" y="334" width="160" height="28" rx="5"/>
  <text x="608" y="353" class="m xs">…/ontology#使用量</text>
  <text x="778" y="353" class="xs t-fnt">…（名前はただ在るだけ）</text>

  <rect class="box-acc" x="770" y="396" width="154" height="28" rx="6"/>
  <text x="847" y="415" class="xs b t-acc" text-anchor="middle">SPARQL は左に問う</text>
  <path class="ln-acc" d="M770 410 H240 V216" marker-end="url(#s3)"/>

  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-ent" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-lnk" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-acc" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
</svg>
