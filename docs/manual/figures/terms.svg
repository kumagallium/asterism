<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" role="img" aria-label="書き方の決まり（RDF と IRI）と語彙（オントロジー・クラス・属性）が合わさって実際のデータになり、そのデータに SPARQL で問う関係の図">
<style>
  :root{
    --ink:#16241a; --body:#33453a; --muted:#54695b; --faint:#84987f;
    --surface:#ffffff; --surface-alt:#f5f9f3; --sink:#e5ede3;
    --line:#d5e0d2; --line-strong:#bccdb9;
    --entity:#2f6b41; --entity-soft:#dcebe0;
    --link:#2d5c86; --link-soft:#dae7f3;
    --accent:#a3661f; --accent-soft:#f4e6d4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e9f1e8; --body:#c3d3c5; --muted:#98ab9a; --faint:#748a76;
      --surface:#18211a; --surface-alt:#1d2820; --sink:#131c15;
      --line:#2b382c; --line-strong:#3f4f40;
      --entity:#7cc491; --entity-soft:#1d3626;
      --link:#88b6e0; --link-soft:#16293b;
      --accent:#e0a862; --accent-soft:#33261a;
    }
  }
  text{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; font-size:13px; fill:var(--ink)}
  .m{font-family:"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace}
  .sm{font-size:11.5px}
  .xs{font-size:10.5px; letter-spacing:.06em}
  .t-mut{fill:var(--muted)}
  .t-fnt{fill:var(--faint)}
  .t-ent{fill:var(--entity)}
  .t-lnk{fill:var(--link)}
  .t-acc{fill:var(--accent)}
  .b{font-weight:700}
  .box{fill:var(--surface); stroke:var(--line-strong); stroke-width:1.25}
  .box-alt{fill:var(--surface-alt); stroke:var(--line-strong); stroke-width:1.25}
  .box-sink{fill:var(--sink); stroke:var(--line-strong); stroke-width:1.25}
  .box-ent{fill:var(--entity-soft); stroke:var(--entity); stroke-width:1.5}
  .box-lnk{fill:var(--link-soft); stroke:var(--link); stroke-width:1.5}
  .box-acc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5}
  .ln{stroke:var(--line-strong); stroke-width:1.5; fill:none}
  .ln-lnk{stroke:var(--link); stroke-width:1.5; fill:none}
  .ln-ent{stroke:var(--entity); stroke-width:1.5; fill:none}
  .ln-dash{stroke:var(--line-strong); stroke-width:1.5; fill:none; stroke-dasharray:5 4}
  .ln-thin{stroke:var(--line); stroke-width:1; fill:none}
  .head{fill:var(--line-strong)}
  .head-lnk{fill:var(--link)}
  .head-ent{fill:var(--entity)}
</style>

  <rect class="box" x="20" y="34" width="400" height="146" rx="10"/>
  <text x="36" y="58" class="xs t-fnt">書き方の決まり — どう書くか</text>
  <rect class="box-alt" x="36" y="70" width="368" height="44" rx="7"/>
  <text x="52" y="90" class="sm b">RDF</text>
  <text x="120" y="90" class="sm t-mut">事実は 3 つ組で書く、という約束</text>
  <rect class="box-alt" x="36" y="122" width="368" height="44" rx="7"/>
  <text x="52" y="142" class="sm b">IRI</text>
  <text x="120" y="142" class="sm t-mut">世界でひとつの名前のつけかた</text>

  <rect class="box" x="520" y="34" width="400" height="146" rx="10"/>
  <text x="536" y="58" class="xs t-fnt">語彙 — 何を書けるか（＝共通の言葉）</text>
  <rect class="box-ent" x="536" y="70" width="368" height="44" rx="7"/>
  <text x="552" y="90" class="sm b t-ent">クラス</text>
  <text x="640" y="90" class="sm t-mut">データの種類（ピーク・試料…）</text>
  <rect class="box-lnk" x="536" y="122" width="368" height="44" rx="7"/>
  <text x="552" y="142" class="sm b t-lnk">属性</text>
  <text x="640" y="142" class="sm t-mut">種類が持つ項目（2θ・d 値…）</text>

  <path class="ln" d="M220 180 V216 H340 V234" marker-end="url(#a3)"/>
  <path class="ln" d="M720 180 V216 H600 V234" marker-end="url(#a3)"/>
  <text x="240" y="208" class="xs t-fnt">この形式で</text>
  <text x="700" y="208" class="xs t-fnt" text-anchor="end">この言葉で</text>

  <rect class="box-alt" x="240" y="240" width="460" height="72" rx="10"/>
  <text x="470" y="270" class="b" text-anchor="middle">事実の集まり ＝ あなたのデータ</text>
  <text x="470" y="292" class="sm t-mut" text-anchor="middle">3 つ組が何百万件も並んだもの。公開すると引用できる。</text>

  <path class="ln-lnk" d="M840 276 H716" marker-end="url(#a4)"/>
  <rect class="box-lnk" x="840" y="252" width="80" height="48" rx="8"/>
  <text x="880" y="274" class="sm b t-lnk" text-anchor="middle">SPARQL</text>
  <text x="880" y="291" class="xs t-mut" text-anchor="middle">問い方</text>
  <text x="778" y="266" class="xs t-lnk" text-anchor="middle">に問う</text>

  <text x="240" y="344" class="xs t-fnt">オントロジーは「データを書くための語彙集」。データそのものではない。</text>
  <text x="240" y="364" class="xs t-fnt">語彙が揃っているほど、別々のデータセットをまたいだ質問に答えられる。</text>

  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-lnk" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
</svg>
