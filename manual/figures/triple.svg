<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="ファイル先頭の材料IDと表の1行から、主語ひとつと4つの述語・値の組、つまり事実4件が作られる図">
<style>
  :root{
    --ink:#16241a; --body:#33453a; --muted:#54695b; --faint:#84987f;
    --surface:#ffffff; --surface-alt:#f5f9f3; --sink:#e5ede3;
    --line:#d5e0d2; --line-strong:#bccdb9;
    --entity:#2f6b41; --entity-soft:#dcebe0;
    --link:#2d5c86; --link-soft:#dae7f3;
    --accent:#a3661f; --accent-soft:#f4e6d4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e9f1e8; --body:#c3d3c5; --muted:#98ab9a; --faint:#748a76;
      --surface:#18211a; --surface-alt:#1d2820; --sink:#131c15;
      --line:#2b382c; --line-strong:#3f4f40;
      --entity:#7cc491; --entity-soft:#1d3626;
      --link:#88b6e0; --link-soft:#16293b;
      --accent:#e0a862; --accent-soft:#33261a;
    }
  }
  text{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; font-size:13px; fill:var(--ink)}
  .m{font-family:"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace}
  .sm{font-size:11.5px}
  .xs{font-size:10.5px; letter-spacing:.06em}
  .t-mut{fill:var(--muted)}
  .t-fnt{fill:var(--faint)}
  .t-ent{fill:var(--entity)}
  .t-lnk{fill:var(--link)}
  .t-acc{fill:var(--accent)}
  .b{font-weight:700}
  .box{fill:var(--surface); stroke:var(--line-strong); stroke-width:1.25}
  .box-alt{fill:var(--surface-alt); stroke:var(--line-strong); stroke-width:1.25}
  .box-sink{fill:var(--sink); stroke:var(--line-strong); stroke-width:1.25}
  .box-ent{fill:var(--entity-soft); stroke:var(--entity); stroke-width:1.5}
  .box-lnk{fill:var(--link-soft); stroke:var(--link); stroke-width:1.5}
  .box-acc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5}
  .ln{stroke:var(--line-strong); stroke-width:1.5; fill:none}
  .ln-lnk{stroke:var(--link); stroke-width:1.5; fill:none}
  .ln-ent{stroke:var(--entity); stroke-width:1.5; fill:none}
  .ln-dash{stroke:var(--line-strong); stroke-width:1.5; fill:none; stroke-dasharray:5 4}
  .ln-thin{stroke:var(--line); stroke-width:1; fill:none}
  .head{fill:var(--line-strong)}
  .head-lnk{fill:var(--link)}
  .head-ent{fill:var(--entity)}
</style>

  <text x="16" y="16" class="xs t-fnt">元のファイル — 先頭の条件（表の外）と、ピークの表</text>
  <rect class="box-acc" x="16" y="24" width="284" height="26" rx="5"/>
  <text x="28" y="42" class="m sm t-acc">No: 03-065-2664</text>
  <text x="290" y="42" class="xs t-acc" text-anchor="end">材料の ID</text>

  <rect class="box-sink" x="16" y="60" width="284" height="26" rx="5"/>
  <rect class="box" x="16" y="86" width="284" height="26" rx="5"/>
  <text x="30" y="78" class="m sm t-mut">2theta</text>
  <text x="112" y="78" class="m sm t-mut">d</text>
  <text x="172" y="78" class="m sm t-mut">I</text>
  <text x="224" y="78" class="m sm t-mut">(hkl)</text>
  <text x="30" y="104" class="m sm">21.34</text>
  <text x="112" y="104" class="m sm">4.161</text>
  <text x="172" y="104" class="m sm">5.0</text>
  <text x="224" y="104" class="m sm">(0,0,2)</text>

  <line class="ln" x1="120" y1="126" x2="120" y2="162" marker-end="url(#a1)"/>
  <text x="134" y="150" class="sm t-mut">変換ルールを通す</text>

  <text x="16" y="180" class="xs t-fnt">つながったデータ — 事実 4 件（1 行ぶん）</text>
  <rect class="box-ent" x="16" y="192" width="284" height="50" rx="8"/>
  <text x="158" y="213" class="m sm b t-ent" text-anchor="middle">peak/03-065-2664/(0,0,2)</text>
  <text x="158" y="231" class="xs t-mut" text-anchor="middle">材料 ID ＋ hkl で作った主語</text>

  <path class="ln-lnk" d="M300 217 H360"/>
  <path class="ln-lnk" d="M360 40 V281"/>
  <path class="ln-lnk" d="M360 40 H442" marker-end="url(#a2)"/>
  <path class="ln-lnk" d="M360 120 H442" marker-end="url(#a2)"/>
  <path class="ln-lnk" d="M360 200 H442" marker-end="url(#a2)"/>
  <path class="ln-lnk" d="M360 281 H442" marker-end="url(#a2)"/>

  <text x="400" y="32" class="xs t-lnk" text-anchor="middle">2θ</text>
  <text x="400" y="112" class="xs t-lnk" text-anchor="middle">d 値</text>
  <text x="400" y="192" class="xs t-lnk" text-anchor="middle">強度</text>
  <text x="400" y="273" class="xs t-lnk" text-anchor="middle">Miller 指数</text>

  <rect class="box-alt" x="452" y="23" width="118" height="34" rx="6"/>
  <text x="511" y="45" class="m sm" text-anchor="middle">21.34</text>
  <rect class="box-alt" x="452" y="103" width="118" height="34" rx="6"/>
  <text x="511" y="125" class="m sm" text-anchor="middle">4.161</text>
  <rect class="box-alt" x="452" y="183" width="118" height="34" rx="6"/>
  <text x="511" y="205" class="m sm" text-anchor="middle">5.0</text>
  <rect class="box-alt" x="452" y="264" width="118" height="34" rx="6"/>
  <text x="511" y="286" class="m sm" text-anchor="middle">(0,0,2)</text>

  <text x="584" y="44" class="xs t-fnt">数値として記録</text>
  <text x="584" y="124" class="xs t-fnt">数値として記録</text>
  <text x="584" y="204" class="xs t-fnt">数値として記録</text>
  <text x="584" y="285" class="xs t-fnt">文字として記録</text>

  <line class="ln-thin" x1="690" y1="14" x2="690" y2="292"/>
  <text x="712" y="36" class="sm b">3 つ組の呼び方</text>
  <text x="712" y="68" class="sm b t-ent">主語</text>
  <text x="712" y="86" class="xs t-mut">何についての事実か</text>
  <text x="712" y="120" class="sm b t-lnk">述語</text>
  <text x="712" y="138" class="xs t-mut">どの項目の話か</text>
  <text x="712" y="172" class="sm b">目的語</text>
  <text x="712" y="190" class="xs t-mut">その値、または相手</text>
  <text x="712" y="228" class="xs t-fnt">主語と述語は必ず IRI</text>
  <text x="712" y="246" class="xs t-fnt">（次の節）。目的語だけ</text>
  <text x="712" y="264" class="xs t-fnt">は値でも、相手の IRI</text>
  <text x="712" y="282" class="xs t-fnt">でもよい。</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-lnk" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
</svg>
