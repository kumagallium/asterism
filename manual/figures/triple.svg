<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="レシピ表の1行が、主語ひとつと3つの述語・値の組、つまり事実3件に展開される図">
<style>
  :root{
    --ink:#16241a; --body:#33453a; --muted:#54695b; --faint:#84987f;
    --surface:#ffffff; --surface-alt:#f5f9f3; --sink:#e5ede3;
    --line:#d5e0d2; --line-strong:#bccdb9;
    --entity:#2f6b41; --entity-soft:#dcebe0;
    --link:#2d5c86; --link-soft:#dae7f3;
    --accent:#a3661f; --accent-soft:#f4e6d4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#e9f1e8; --body:#c3d3c5; --muted:#98ab9a; --faint:#748a76;
      --surface:#18211a; --surface-alt:#1d2820; --sink:#131c15;
      --line:#2b382c; --line-strong:#3f4f40;
      --entity:#7cc491; --entity-soft:#1d3626;
      --link:#88b6e0; --link-soft:#16293b;
      --accent:#e0a862; --accent-soft:#33261a;
    }
  }
  text{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; font-size:13px; fill:var(--ink)}
  .m{font-family:"SF Mono",Menlo,Consolas,"IBM Plex Mono",monospace}
  .sm{font-size:11.5px}
  .xs{font-size:10.5px; letter-spacing:.06em}
  .t-mut{fill:var(--muted)}
  .t-fnt{fill:var(--faint)}
  .t-ent{fill:var(--entity)}
  .t-lnk{fill:var(--link)}
  .t-acc{fill:var(--accent)}
  .b{font-weight:700}
  .box{fill:var(--surface); stroke:var(--line-strong); stroke-width:1.25}
  .box-alt{fill:var(--surface-alt); stroke:var(--line-strong); stroke-width:1.25}
  .box-sink{fill:var(--sink); stroke:var(--line-strong); stroke-width:1.25}
  .box-ent{fill:var(--entity-soft); stroke:var(--entity); stroke-width:1.5}
  .box-lnk{fill:var(--link-soft); stroke:var(--link); stroke-width:1.5}
  .box-acc{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5}
  .ln{stroke:var(--line-strong); stroke-width:1.5; fill:none}
  .ln-lnk{stroke:var(--link); stroke-width:1.5; fill:none}
  .ln-ent{stroke:var(--entity); stroke-width:1.5; fill:none}
  .ln-dash{stroke:var(--line-strong); stroke-width:1.5; fill:none; stroke-dasharray:5 4}
  .ln-thin{stroke:var(--line); stroke-width:1; fill:none}
  .head{fill:var(--line-strong)}
  .head-lnk{fill:var(--link)}
  .head-ent{fill:var(--entity)}
</style>
  <text x="16" y="24" class="xs t-fnt">元のファイル — 先頭の条件（表の外）と、レシピの表</text>
  <rect class="box-acc" x="16" y="34" width="284" height="26" rx="5"/>
  <text x="28" y="52" class="m sm t-acc">作成者: 山田</text>
  <text x="290" y="52" class="xs t-acc" text-anchor="end">表の外</text>

  <rect class="box-sink" x="16" y="70" width="284" height="27" rx="5"/>
  <rect class="box" x="16" y="97" width="284" height="27" rx="5"/>
  <text x="30" y="88" class="m sm t-mut">料理名</text>
  <text x="118" y="88" class="m sm t-mut">食材名</text>
  <text x="210" y="88" class="m sm t-mut">分量</text>
  <text x="256" y="88" class="m sm t-mut">単位</text>
  <text x="30" y="115" class="m sm">カレー</text>
  <text x="118" y="115" class="m sm">にんじん</text>
  <text x="210" y="115" class="m sm">2</text>
  <text x="256" y="115" class="m sm">本</text>

  <line class="ln" x1="120" y1="138" x2="120" y2="172" marker-end="url(#a1)"/>
  <text x="134" y="160" class="sm t-mut">変換ルールを通す</text>

  <text x="16" y="192" class="xs t-fnt">つながったデータ — 事実 3 件（1 行ぶん）</text>
  <rect class="box-ent" x="16" y="202" width="284" height="50" rx="8"/>
  <text x="158" y="223" class="m sm b t-ent" text-anchor="middle">使用量/カレー/にんじん</text>
  <text x="158" y="241" class="xs t-mut" text-anchor="middle">料理名 ＋ 食材名で作った主語</text>

  <path class="ln-lnk" d="M300 227 H360"/>
  <path class="ln-lnk" d="M360 60 V240"/>
  <path class="ln-lnk" d="M360 60 H442" marker-end="url(#a2)"/>
  <path class="ln-lnk" d="M360 150 H442" marker-end="url(#a2)"/>
  <path class="ln-lnk" d="M360 240 H442" marker-end="url(#a2)"/>

  <text x="400" y="52" class="xs t-lnk" text-anchor="middle">分量</text>
  <text x="400" y="142" class="xs t-lnk" text-anchor="middle">単位</text>
  <text x="400" y="232" class="xs t-lnk" text-anchor="middle">食材</text>

  <rect class="box-alt" x="452" y="43" width="118" height="34" rx="6"/>
  <text x="511" y="65" class="m sm" text-anchor="middle">2</text>
  <rect class="box-alt" x="452" y="133" width="118" height="34" rx="6"/>
  <text x="511" y="155" class="m sm" text-anchor="middle">本</text>
  <rect class="box-ent" x="452" y="223" width="150" height="34" rx="6"/>
  <text x="527" y="245" class="m sm t-ent" text-anchor="middle">食材/にんじん</text>

  <text x="584" y="64" class="xs t-fnt">数値として記録</text>
  <text x="584" y="154" class="xs t-fnt">文字として記録</text>
  <text x="452" y="278" class="xs t-acc">別のものへの参照 ＝ ここで価格表とつながる</text>

  <line class="ln-thin" x1="700" y1="14" x2="700" y2="292"/>
  <text x="722" y="36" class="sm b">3 つ組の呼び方</text>
  <text x="722" y="68" class="sm b t-ent">主語</text>
  <text x="722" y="86" class="xs t-mut">何についての事実か</text>
  <text x="722" y="120" class="sm b t-lnk">述語</text>
  <text x="722" y="138" class="xs t-mut">どの項目の話か</text>
  <text x="722" y="172" class="sm b">目的語</text>
  <text x="722" y="190" class="xs t-mut">その値、または相手</text>
  <text x="722" y="228" class="xs t-fnt">主語と述語は必ず IRI。</text>
  <text x="722" y="246" class="xs t-fnt">目的語だけは値でも、</text>
  <text x="722" y="264" class="xs t-fnt">相手の IRI でもよい。</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-lnk" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
</svg>
