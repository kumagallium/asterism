[project]
name = "asterism-api"
version = "0.1.0"
description = "Upload API + watcher driver for asterism (Phase 2)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # asterism-ingest and asterism-step0 are installed from sibling paths; see
    # [tool.uv.sources] below. step0's inspect path is dependency-free.
    "asterism-ingest",
    "asterism-step0",
    # Both LLM provider SDKs for the multi-provider client seam (asterism_step0.llm):
    # Anthropic (default Claude) + OpenAI (any OpenAI-compatible endpoint, e.g.
    # Sakura AI Engine via a custom base_url). Pinned here so the api venv always
    # has them; step0 lazy-imports them inside complete().
    "anthropic>=0.40",
    "openai>=1.40",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Local mode (asterism-local) with the declarative ingest engine included:
# materialize/ingest need morph-kgc, which the hosted image installs via
# ingest[substrate], and the demo-agent (Ask) child lazily imports
# asterism_mcp.tools (which pulls fastmcp). `uv pip install -e '.[local]'`
# gives a laptop the same surface as the hosted stack.
local = [
    "asterism-ingest[substrate]",
    "asterism-mcp-tools",
]

[project.scripts]
asterism-api = "asterism_api.main:_main"
asterism-local = "asterism_api.local:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asterism_api"]

[tool.uv.sources]
asterism-ingest = { path = "../ingest", editable = true }
asterism-step0 = { path = "../step0", editable = true }
asterism-mcp-tools = { path = "../mcp", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Prose in this repo is Japanese, where full-width punctuation（）「」／ is correct
# typography — not an ASCII look-alike. RUF002 (docstrings) / RUF003 (comments) flag
# every one, so each Japanese file had to carry its own `# ruff: noqa` pragma; missing
# one on a new docstring turned main red (#518, v0.32.1). Ignore them once here.
# RUF001 stays ON: an ambiguous character in a *string literal* can silently corrupt an
# IRI, a prefix or a SPARQL match, so those keep a per-site noqa with a stated reason.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are calls-in-defaults by design (not B008 bugs).
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.mypy]
strict = true
python_version = "3.11"
