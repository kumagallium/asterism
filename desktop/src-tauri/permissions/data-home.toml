# App-defined command permissions for the storage-location setting (ADR
# app-data-on-disk.md D4). These are the app's own commands, not a plugin's,
# so they are namespaced by identifier only (no `<plugin>:` prefix) — see
# https://tauri.app/security/permissions/#permission-identifier.

[[permission]]
identifier = "allow-get-data-home-override"
description = "Read the saved storage-location override (null if unset)."
commands.allow = ["get_data_home_override"]

[[permission]]
identifier = "allow-set-data-home-override"
description = """Save or clear the storage-location override, optionally
scheduling a data move for the next launch (`moveFrom`). Writes only — does
not touch the filesystem itself; the move (if any) runs at the start of the
next boot, before the sidecar starts."""
commands.allow = ["set_data_home_override"]

[[permission]]
identifier = "allow-get-storage-notice"
description = """Read the outcome of the most recent boot-time data move, if
any (null otherwise)."""
commands.allow = ["get_storage_notice"]

[[permission]]
identifier = "allow-clear-storage-notice"
description = "Clear the stored move-outcome notice once the SPA has shown it."
commands.allow = ["clear_storage_notice"]
